name: 'GoldenCI / integration-tests'
description: 'Runs the caller-supplied integration test command against the review environment.'

inputs:
  cmd:
    required: false
    default: ''
  working-directory:
    required: false
    default: '.'
  review-env-url:
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - if: inputs.cmd == ''
      shell: bash
      run: |
        set -euo pipefail
        echo "::notice::review-env is enabled but integration-test-cmd is empty; no integration tests ran"
        printf -- '- integration tests: no `integration-test-cmd` configured — skipped\n' >> "$GITHUB_STEP_SUMMARY"

    - if: inputs.cmd != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REVIEW_ENV_URL: ${{ inputs.review-env-url }}
      run: ${{ inputs.cmd }}
