name: 'GoldenCI / coverage-path'
description: 'Resolves the per-language coverage artifact path, with an optional prefix for integration coverage.'

inputs:
  language:
    required: true
  working-directory:
    required: false
    default: '.'
  prefix:
    description: "Subdirectory the coverage file was written under, e.g. 'integration-coverage/'"
    required: false
    default: ''

outputs:
  file:
    value: ${{ steps.resolve.outputs.file }}
  artifact:
    value: ${{ steps.resolve.outputs.artifact }}

runs:
  using: 'composite'
  steps:
    - id: resolve
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
        WORKDIR: ${{ inputs.working-directory }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail
        case "$LANGUAGE" in
          go)     name="coverage.out" ;;
          node)   name="coverage/coverage-summary.json" ;;
          python) name="coverage.xml" ;;
          *)      echo "unsupported language '$LANGUAGE'" >&2; exit 1 ;;
        esac
        file="${PREFIX}${name}"
        echo "file=$file" >> "$GITHUB_OUTPUT"
        echo "artifact=${WORKDIR%/}/$file" >> "$GITHUB_OUTPUT"
