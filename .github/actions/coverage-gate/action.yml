name: 'GoldenCI / coverage-gate'
description: 'Parses a coverage artifact and gates it against a threshold.'

inputs:
  language:
    required: true
  working-directory:
    required: false
    default: '.'
  coverage-file:
    required: false
    default: ''
  threshold:
    required: false
    default: '0'
  label:
    required: false
    default: 'unit'
  allow-missing:
    required: false
    default: 'false'

outputs:
  coverage:
    value: ${{ steps.gate.outputs.coverage }}
  passed:
    value: ${{ steps.gate.outputs.passed }}

runs:
  using: 'composite'
  steps:
    - id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANGUAGE: ${{ inputs.language }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}
        THRESHOLD: ${{ inputs.threshold }}
        LABEL: ${{ inputs.label }}
        ALLOW_MISSING: ${{ inputs.allow-missing }}
      run: bash "${{ github.action_path }}/../../../internal/scripts/coverage-gate.sh"
