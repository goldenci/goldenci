name: 'GoldenCI / install-deps'
description: 'Installs project dependencies for the detected language.'

inputs:
  language:
    required: true
  working-directory:
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANGUAGE: ${{ inputs.language }}
      run: bash "${{ github.action_path }}/../../../internal/scripts/install-deps.sh"
