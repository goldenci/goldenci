name: 'GoldenCI / run-unit-tests'
description: 'Runs the language-native unit test command, with coverage.'

inputs:
  language:
    required: true
  working-directory:
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANGUAGE: ${{ inputs.language }}
      run: |
        set -euo pipefail
        case "$LANGUAGE" in
          go)     go test ./... -covermode=atomic -coverprofile=coverage.out ;;
          node)   npm test -- --coverage --coverageReporters=json-summary --coverageReporters=text ;;
          python) pytest --cov=. --cov-report=xml --cov-report=term --ignore=.goldenci-tools ;;
        esac
