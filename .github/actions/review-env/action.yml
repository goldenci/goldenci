name: 'GoldenCI / review-env'
description: 'Runs the caller-supplied command that provisions an ephemeral review environment.'

inputs:
  cmd:
    required: false
    default: ''
  working-directory:
    required: false
    default: '.'

outputs:
  url:
    value: ${{ steps.up.outputs.url }}

runs:
  using: 'composite'
  steps:
    - if: inputs.cmd == ''
      shell: bash
      run: |
        set -euo pipefail
        echo "::notice::review-env is enabled but review-env-cmd is empty; nothing was provisioned"
        printf -- '- review-env: no `review-env-cmd` configured — skipped\n' >> "$GITHUB_STEP_SUMMARY"

    # The command is contractually required to write url=<URL> to
    # $GITHUB_OUTPUT so callers and the workflow output can use it.
    - id: up
      if: inputs.cmd != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.cmd }}

    - if: inputs.cmd != ''
      shell: bash
      env:
        REVIEW_ENV_URL: ${{ steps.up.outputs.url }}
      run: |
        set -euo pipefail
        if [ -z "${REVIEW_ENV_URL:-}" ]; then
          echo "::warning::review-env-cmd did not write url=<URL> to \$GITHUB_OUTPUT"
        fi
        printf -- '- review-env: %s\n' "${REVIEW_ENV_URL:-not reported}" >> "$GITHUB_STEP_SUMMARY"
