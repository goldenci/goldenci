name: 'GoldenCI / detect-language'
description: 'Resolves the project language: go, node, or python.'

inputs:
  language:
    description: 'go | node | python | auto'
    required: false
    default: auto
  working-directory:
    required: false
    default: '.'

outputs:
  language:
    value: ${{ steps.detect.outputs.language }}

runs:
  using: 'composite'
  steps:
    # Only used as a diagnostic when marker-file detection finds nothing —
    # see the note above detect-language.sh's final error block.
    - uses: fabasoad/setup-enry-action@b0f209311352caecf5b95ec6916cfe7e4adf1af2 # v0.4.3

    - id: detect
      shell: bash
      env:
        INPUT_LANGUAGE: ${{ inputs.language }}
        WORKDIR: ${{ inputs.working-directory }}
      run: bash "${{ github.action_path }}/../../../internal/scripts/detect-language.sh"

    - shell: bash
      env:
        LANGUAGE: ${{ steps.detect.outputs.language }}
      run: |
        printf 'Detected language: %s\n' "${LANGUAGE:-unknown}" >> "$GITHUB_STEP_SUMMARY"
