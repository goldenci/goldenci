# Releases GoldenCI itself. Push a tag matching v<major>.<minor>.<patch>
# (e.g. v1.4.0) and this creates the GitHub Release and moves the major
# tag (v1) to point at it, so consumers pinned to @v1 pick it up.
#
# First release on a new major (v1.0.0): after this workflow finishes,
# open the release on GitHub and check "Publish this Action to the
# GitHub Marketplace" — that step has no API and must be done once by hand.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '$tag' is not v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "major=${tag%%.*}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

      - shell: bash
        env:
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name  "goldenci[bot]"
          git config user.email "goldenci-bot@users.noreply.github.com"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push origin "$MAJOR" --force
